<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141019" />
    <link rel="icon" type="image/png" sizes="112x112" href="/images/brand/vlor-favicon.png" />
    <script>
      try {
        var stored = localStorage.getItem("malika.language.v1");
        var code = stored === '"en"' ? "en" : "ar";
        document.documentElement.lang = code;
        document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      } catch (error) {}
    </script>
    <meta
      name="description"
      content="VLOR — an independent perfume house in Cairo. Small-batch extraits, hand-assembled flacons and scent discovery. VLOR — عطور فاخرة تُمزج بكميات صغيرة، توصيل لكل مصر."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <title>VLOR — Presence, bottled</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
